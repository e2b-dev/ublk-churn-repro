name: kernels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    # The ubuntu-24.04 runner's own kernel is an azure build, so each
    # kernel under test is booted in a virtme-ng microVM that shares the
    # runner's rootfs.
    name: kernel ${{ matrix.prefix }}${{ matrix.udev && format(' +{0}', matrix.udev) || '' }} (microVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: "6.8" # noble GA
            meta: linux-image-generic
          - prefix: "6.14" # noble HWE series carrying the CVE-2025-37906 fix
            meta: series
          - prefix: "7.0" # current noble HWE: expected to wedge
            meta: linux-image-generic-hwe-24.04
          # Same two kernels with udevd left running, to test whether
          # udev is the missing ingredient (the Go suite that wedges
          # runs with it active).
          - prefix: "6.14"
            meta: series
            udev: udev
          - prefix: "7.0"
            meta: linux-image-generic-hwe-24.04
            udev: udev
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtme-ng and the target kernel
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends virtme-ng qemu-system-x86 virtiofsd
          pkg="${{ matrix.meta }}"
          if [ "$pkg" = series ]; then
            pkg=$(apt-cache pkgnames "linux-image-${{ matrix.prefix }}" \
              | grep -E "^linux-image-${{ matrix.prefix }}\.[0-9.-]+-generic$" | sort -V | tail -1)
          fi
          sudo apt-get install -y --no-install-recommends "$pkg"
          kver=$(ls /lib/modules | grep -E "^${{ matrix.prefix }}\." | sort -V | tail -1)
          if ! ls "/lib/modules/${kver}/kernel/drivers/block/"ublk_drv.ko* 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-${kver}"
          fi
          sudo chmod 644 "/boot/vmlinuz-${kver}"
          echo "KVER=${kver}" >> "$GITHUB_ENV"
      - name: Build
        run: make
      - name: Run in microVM
        run: |
          set -eux
          # vng flattens and re-parses its command argv and can expand $?
          # before the guest sees it, so the guest steps live in a script
          # and the status file it writes is authoritative.
          rm -f vm-status
          vng --run "/boot/vmlinuz-${KVER}" --user root --cpus 4 --memory 4G \
            --rwdir "$PWD" --verbose -- \
            /bin/bash "$PWD/ci/guest.sh" "${{ matrix.prefix }}" "${{ matrix.udev }}" || true
          echo "guest status: $(cat vm-status 2>/dev/null || echo '<none>')"
          test "$(cat vm-status)" = "0"

  ublksrv:
    # The decisive test: churn the upstream reference server
    # (ublk-org/ublksrv, by the ublk maintainer) instead of ublk-go. If
    # this wedges, the bug is in the kernel, not in any one server.
    name: ublksrv churn on ${{ matrix.prefix }} (microVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: "6.8"
            meta: linux-image-generic
          - prefix: "6.14"
            meta: series
          - prefix: "6.18"
            meta: mainline
          - prefix: "7.0"
            meta: linux-image-generic-hwe-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtme-ng and the target kernel
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends virtme-ng qemu-system-x86 virtiofsd
          pkg="${{ matrix.meta }}"
          if [ "$pkg" = series ]; then
            pkg=$(apt-cache pkgnames "linux-image-${{ matrix.prefix }}" \
              | grep -E "^linux-image-${{ matrix.prefix }}\.[0-9.-]+-generic$" | sort -V | tail -1)
          fi
          if [ "$pkg" = mainline ]; then
            base=https://kernel.ubuntu.com/mainline/
            tag=$(curl -sS "$base" | grep -oE "v${{ matrix.prefix }}\.[0-9]+/" \
              | sort -uV | tail -1 | tr -d /)
            mkdir -p /tmp/ml && cd /tmp/ml
            for f in $(curl -sS "${base}${tag}/amd64/" | grep -oE '[a-z0-9._+-]+\.deb' \
                       | sort -u | grep -E 'linux-(image-unsigned|modules)-'); do
              curl -sSO "${base}${tag}/amd64/${f}"
            done
            sudo apt-get install -y --no-install-recommends wireless-regdb
            sudo dpkg -i ./*.deb || true
            cd -
          else
            sudo apt-get install -y --no-install-recommends "$pkg"
          fi
          kver=$(ls /lib/modules | grep -E "^${{ matrix.prefix }}\." | sort -V | tail -1)
          test -n "$kver"
          if ! ls "/lib/modules/${kver}/kernel/drivers/block/"ublk_drv.ko* 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-${kver}" || true
          fi
          ls "/lib/modules/${kver}/kernel/drivers/block/"ublk_drv.ko*
          test -f "/boot/vmlinuz-${kver}"
          sudo chmod 644 "/boot/vmlinuz-${kver}"
          echo "KVER=${kver}" >> "$GITHUB_ENV"
      - name: Build ublksrv (upstream reference server)
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends \
            liburing-dev autoconf automake libtool pkg-config g++ make
          git clone --depth 1 https://github.com/ublk-org/ublksrv
          cd ublksrv
          git log --oneline -1
          autoreconf -i
          ./configure
          make -j"$(nproc)"
          test -x ublk && test -x .libs/ublk
      - name: Churn ublksrv in the microVM
        run: |
          set -eux
          rm -f vm-status
          vng --run "/boot/vmlinuz-${KVER}" --user root --cpus 4 --memory 4G \
            --rwdir "$PWD" --verbose -- \
            /bin/bash "$PWD/ci/ublksrv-guest.sh" "${{ matrix.prefix }}" 600 || true
          echo "guest status: $(cat vm-status 2>/dev/null || echo '<none>')"
          test "$(cat vm-status)" = "0"

  mainline:
    # Is the 7.0 wedge upstream, or Ubuntu-specific? Ubuntu's own
    # mainline builds are vanilla kernel.org trees with no Ubuntu
    # patches, so a clean mainline v7.0 next to a wedging
    # 7.0.0-28-generic points at Ubuntu's backports, and a wedging
    # mainline points upstream.
    name: mainline ${{ matrix.tag }} (microVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v7.0 # what noble's hwe-7.0 is based on
            prefix: "7.0"
          - tag: v7.0.12 # newest 7.0 stable, in case it is already fixed
            prefix: "7.0"
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtme-ng and the mainline kernel
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends virtme-ng qemu-system-x86 virtiofsd
          base="https://kernel.ubuntu.com/mainline/${{ matrix.tag }}/amd64/"
          mkdir -p /tmp/ml && cd /tmp/ml
          # image + modules only; headers are not needed to boot.
          for f in $(curl -sS "$base" | grep -oE '[a-z0-9._+-]+\.deb' | sort -u \
                     | grep -E 'linux-(image-unsigned|modules)-'); do
            curl -sSO "${base}${f}"
          done
          ls -l
          # mainline linux-modules depends on wireless-regdb; install it
          # first so dpkg can configure the packages.
          sudo apt-get install -y --no-install-recommends wireless-regdb
          # The mainline image postinst trips over an initramfs hook
          # ("run-parts: missing operand") on this runner image. The
          # files unpack fine, which is all vng needs, so check for the
          # artifacts rather than trusting dpkg's exit code.
          sudo dpkg -i ./*.deb || true
          kver=$(ls /lib/modules | grep -E "^${{ matrix.prefix }}\.[0-9]+-0" | sort -V | tail -1)
          test -n "$kver"
          test -f "/boot/vmlinuz-${kver}"
          ls "/lib/modules/${kver}/kernel/drivers/block/"ublk_drv.ko*
          sudo chmod 644 "/boot/vmlinuz-${kver}"
          echo "KVER=${kver}" >> "$GITHUB_ENV"
      - name: Build
        run: make
      - name: Run in microVM
        run: |
          set -eux
          rm -f vm-status
          vng --run "/boot/vmlinuz-${KVER}" --user root --cpus 4 --memory 4G \
            --rwdir "$PWD" --verbose -- \
            /bin/bash "$PWD/ci/guest.sh" "${{ matrix.prefix }}" || true
          echo "guest status: $(cat vm-status 2>/dev/null || echo '<none>')"
          test "$(cat vm-status)" = "0"

  host:
    name: host kernel (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          set -eux
          uname -r
          sudo modprobe ublk_drv
          make
          sudo ./ublk_churn_repro 3000 30
